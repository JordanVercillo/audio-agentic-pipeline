name: CI

# Lint + the synthetic-data test suite. No secrets, no network, no real audio
# required — the tests use generate_test_signal(), so this runs free on every
# push and PR (SPEC P6; the platform-DE "solid engineering practices" signal).

on:
  push:
  pull_request:

# The jobs only read the repo — never grant the default write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # soundfile writes the synthetic WAV fixtures; libsndfile is its backend.
      - name: Install audio system libs
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --frozen: install exactly what uv.lock pins; fails if the lock is stale
      # (which is itself a useful check that deps and lock stay in sync).
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Test (pytest — synthetic data)
        run: uv run pytest

  # SPEC P7: prove the PySpark jobs produce the same results as the pandas
  # transforms. Runs natively on Linux (no winutils needed) — the acceptance
  # evidence that the distributed path is correct.
  spark-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PySpark 4.x (pinned 4.1.2 in uv.lock) dropped Java 8/11 — needs 17+.
      - name: Set up Java 17 (Spark 4.x runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Spark ↔ pandas parity (row-count + centroid)
        run: uv run python spark/parity_check.py

  # Vision F P4.6.1 (F13): the repo is public and history already hid one
  # secret in committed bytecode (journal #32) — the one-time L-flip scrub
  # needs a continuous successor. Scans the full history on every push.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
