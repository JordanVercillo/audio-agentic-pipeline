name: CI

# Lint + the synthetic-data test suite. No secrets, no network, no real audio
# required — the tests use generate_test_signal(), so this runs free on every
# push and PR (SPEC P6; the platform-DE "solid engineering practices" signal).

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # soundfile writes the synthetic WAV fixtures; libsndfile is its backend.
      - name: Install audio system libs
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --frozen: install exactly what uv.lock pins; fails if the lock is stale
      # (which is itself a useful check that deps and lock stay in sync).
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Test (pytest — synthetic data)
        run: uv run pytest

  # SPEC P7: prove the PySpark jobs produce the same results as the pandas
  # transforms. Runs natively on Linux (no winutils needed) — the acceptance
  # evidence that the distributed path is correct.
  spark-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 11 (Spark 3.5 runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Spark ↔ pandas parity (row-count + centroid)
        run: uv run python spark/parity_check.py
