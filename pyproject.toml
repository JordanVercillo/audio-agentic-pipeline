# pyproject.toml — canonical project + dependency manifest (SPEC P6).
# uv is the source of truth (uv.lock pins the full graph); requirements.txt is
# kept as a human-readable / pip-compatible export.
#
# This is an APPLICATION, not an installable library: modules are imported as
# `src.<layer>` with the repo root on sys.path (scripts insert it), so
# [tool.uv] package = false — uv manages the environment but builds nothing.

[project]
name = "audio-agentic-pipeline"
version = "0.5.0"                       # through SPEC Phase 5 (agent access layer)
description = "Spotify top tracks + local DSP feature extraction → medallion warehouse → taste analytics, with an MCP agent access layer."
authors = [{ name = "Jordan Vercillo" }]
readme = "README.md"
requires-python = ">=3.11"             # developed/verified on conda base 3.13
license = { text = "MIT" }

dependencies = [
    # ── Core DSP & audio I/O ──
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    # ── Data serialization (Parquet only, pyarrow engine) ──
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # ── Spotify API (PKCE only — NO client secret anywhere) + .env loading ──
    "spotipy>=2.23.0",
    "python-dotenv>=1.0.0",
    # ── Audio acquisition (YouTube → MP3); CVE floor pinned ──
    "yt-dlp>=2026.2.21",
    # ── Vector search + dimensionality reduction + clustering ──
    "faiss-cpu>=1.7.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.3.0",
    # ── Distributed transforms ──
    "pyspark>=3.5.0",
    # ── Visualization + single-file HTML report ──
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    # ── Agent Access Layer: MCP server + read-only SQL ──
    "mcp>=1.2.0",
    "duckdb>=1.1.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false                        # application, not a buildable package

[tool.pytest.ini_options]
testpaths = ["src"]                    # tests are colocated with modules
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Lint only the maintained code — legacy/ is archived v0 (see legacy/README.md);
# notebooks + uv single-file skill scripts have their own style.
extend-exclude = ["legacy", "notebooks", ".claude"]

[tool.ruff.lint]
# Real-issue rules over pure-style churn. Deliberately NOT enabling UP
# (pyupgrade): the codebase uses typing.Optional/Union consistently, and
# rewriting ~190 signatures to PEP 604 would bury the diff for no correctness
# gain. Ruff is used as a LINTER, not a formatter — the box-drawing section
# comments are intentional.
select = ["E", "F", "I", "B"]
ignore = ["E501"]                      # long docstring tables / ASCII art are intentional
