<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Vercillo Analytics — Taste Pilot{% endblock %}</title>
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🎧</text></svg>'>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">Vercillo Analytics <span>· Taste Pilot</span></a>
    <nav>
      {% if authed %}<a href="/dashboard">Dashboard</a><a href="/analytics">Analytics</a><a href="/explore">Explore</a><a href="/logout">Log out</a>
      {% else %}<a href="/login" class="cta">Log in with Spotify</a>{% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site">
    <span>PKCE auth · no client secret · session-ephemeral · <a href="/privacy">privacy</a></span>
    <span>Acoustic features from local DSP · the bridge key is the feature store</span>
  </footer>
</body>
</html>
